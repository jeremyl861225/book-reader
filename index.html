<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Book reader</title>
<meta name="description" content="行動書架：多書收藏、章節閱讀、螢光筆、筆記、全文搜尋">
<meta name="theme-color" content="#F3EDE0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Book reader">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 主要分頁 ============ -->
<main id="views">

  <!-- 書架 -->
  <section id="view-shelf" class="view active">
    <header class="topbar"><h1>書架</h1></header>
    <div class="view-body" id="shelf-body"></div>
  </section>

  <!-- 某一本書的目錄 -->
  <section id="view-toc" class="view">
    <header class="topbar sub">
      <button id="toc-back" class="textbtn">返回書架</button>
      <h1 id="toc-title"></h1>
    </header>
    <div class="view-body" id="toc-body"></div>
  </section>

  <!-- 搜尋 -->
  <section id="view-search" class="view">
    <header class="topbar">
      <form id="search-form">
        <input type="search" id="search-input" placeholder="搜尋全書架內文…" autocomplete="off">
      </form>
    </header>
    <div class="view-body" id="search-body">
      <p class="hint">輸入關鍵字後按搜尋，結果會列出所有出現位置。</p>
    </div>
  </section>

  <!-- 筆記總覽 -->
  <section id="view-notes" class="view">
    <header class="topbar">
      <h1>筆記</h1>
      <div class="seg" id="notes-filter">
        <button data-f="all" class="on">全部標記</button>
        <button data-f="noted">有筆記</button>
      </div>
    </header>
    <div class="view-body" id="notes-body"></div>
  </section>

  <!-- 設定 -->
  <section id="view-settings" class="view">
    <header class="topbar"><h1>設定</h1></header>
    <div class="view-body" id="settings-body">

      <div class="card">
        <h2>加入內容</h2>
        <label class="row stack">收進哪一本書
          <select id="import-target"></select>
        </label>
        <button id="btn-import" class="btn primary">匯入章節（PDF / 內容包）</button>
        <input type="file" id="file-input" accept=".pdf,.json,application/pdf,application/json" multiple hidden>
        <p class="hint">可一次選多個檔案。支援：<br>
          ① 章節 PDF（就地抽取文字），檔名建議「第1章第2節 標題.pdf」或「1-2 標題.pdf」<br>
          ② 內容包 .json（預轉換的章節，含圖片）<br>
          內容只儲存在此裝置，不會上傳。</p>
        <div id="import-progress" class="hint" hidden></div>
      </div>

      <div class="card">
        <h2>書籍管理</h2>
        <p class="hint">匯出的書籍檔包含該書的全部內容、螢光筆與筆記，可在另一支手機匯入接著讀。</p>
        <div id="book-list"></div>
        <button id="btn-new-book" class="btn">新增一本空書</button>
        <button id="btn-import-book" class="btn">匯入書籍檔</button>
        <input type="file" id="book-input" accept=".json,application/json" hidden>
        <div id="book-progress" class="hint" hidden></div>
      </div>

      <div class="card">
        <h2>閱讀偏好</h2>
        <label class="row">字體大小
          <input type="range" id="font-size" min="14" max="26" step="1">
          <span id="font-size-val"></span>
        </label>
        <label class="row">行距
          <input type="range" id="line-height" min="1.4" max="2.6" step="0.1">
          <span id="line-height-val"></span>
        </label>
        <label class="row">主題
          <select id="theme-sel">
            <option value="auto">跟隨系統</option>
            <option value="light">米白</option>
            <option value="dark">夜讀</option>
          </select>
        </label>
      </div>

      <div class="card">
        <h2>整機備份</h2>
        <p class="hint">備份整個書架（所有書籍、螢光筆與筆記）。還原會覆蓋目前全部資料。</p>
        <button id="btn-export" class="btn">匯出整個書架</button>
        <button id="btn-restore" class="btn">還原備份</button>
        <input type="file" id="restore-input" accept=".json,application/json" hidden>
        <button id="btn-wipe" class="btn danger">清除所有資料</button>
      </div>

      <p class="hint center" id="app-version"></p>
    </div>
  </section>
</main>

<!-- ============ 底部導覽 ============ -->
<nav id="tabbar">
  <button data-view="shelf" class="on">書架</button>
  <button data-view="search">搜尋</button>
  <button data-view="notes">筆記</button>
  <button data-view="settings">設定</button>
</nav>

<!-- ============ 閱讀頁（覆蓋層） ============ -->
<section id="reader" hidden>
  <header class="topbar reader-bar">
    <button id="reader-back" class="iconbtn" aria-label="返回">←</button>
    <div class="reader-title">
      <div id="reader-chapter" class="small"></div>
      <div id="reader-section"></div>
    </div>
    <div class="reader-navbtns">
      <button id="reader-prev" class="iconbtn" aria-label="上一節">‹</button>
      <button id="reader-next" class="iconbtn" aria-label="下一節">›</button>
    </div>
  </header>
  <article id="reader-content"></article>
</section>

<!-- 選字浮動工具列 -->
<div id="hl-toolbar" hidden>
  <button class="dot" data-color="yellow" aria-label="黃色螢光筆"></button>
  <button class="dot" data-color="green" aria-label="綠色螢光筆"></button>
  <button class="dot" data-color="blue" aria-label="藍色螢光筆"></button>
  <button class="dot" data-color="pink" aria-label="粉色螢光筆"></button>
  <button id="hl-note-btn">＋筆記</button>
</div>

<!-- 標記編輯底部面板 -->
<div id="sheet-mask" hidden></div>
<div id="hl-sheet" hidden>
  <div class="sheet-quote" id="sheet-quote"></div>
  <div class="sheet-colors">
    <button class="dot" data-color="yellow"></button>
    <button class="dot" data-color="green"></button>
    <button class="dot" data-color="blue"></button>
    <button class="dot" data-color="pink"></button>
  </div>
  <textarea id="sheet-note" placeholder="在這裡輸入筆記…" rows="4"></textarea>
  <div class="sheet-actions">
    <button id="sheet-delete" class="btn danger">刪除標記</button>
    <button id="sheet-save" class="btn primary">儲存</button>
  </div>
</div>

<div id="toast" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
